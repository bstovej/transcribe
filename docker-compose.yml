services:
  ui:
    build: .
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - .:/app
      - ./input:/app/input
      - ./output:/app/output
    environment:
      - TRANSCRIBE_CONFIG_PATH=/app/transcribe_config.json
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: streamlit run app.py --server.address=0.0.0.0 --server.headless=true

  transcribe:
    build: .
    volumes:
      - .:/app
      - ./input:/app/input
      - ./output:/app/output
    environment:
      - TRANSCRIBE_CONFIG_PATH=/app/transcribe_config.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: python transcribe.py

  transcribe_only:
    build: .
    volumes:
      - .:/app
      - ./input:/app/input
    environment:
      - TRANSCRIBE_CONFIG_PATH=/app/transcribe_config.json
    command: python transcribe_only.py

  summarize:
    build: .
    volumes:
      - .:/app
      - ./input:/app/input
      - ./output:/app/output
    environment:
      - TRANSCRIBE_CONFIG_PATH=/app/transcribe_config.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: python summarize_text.py
